<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>earloop — HTML Demo</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="demo.css">
</head>
<body class="demo-page">
  <div class="demo-shell">
    <header class="demo-topbar"><a class="demo-product" href="works.html"><span class="demo-product-mark">e</span><span>earloop / Sound Loop</span></a><div class="demo-top-actions"><span>HTML DEMO</span><a class="demo-back" href="works.html">返回作品 ↗</a></div></header>
    <main class="earloop-stage">
      <p class="demo-kicker">Loop library / audio playground</p><h1 class="demo-heading">让声音，<em>循环起来。</em></h1><p class="demo-subtitle">一个轻量的声音循环 HTML Demo。选择预设、播放和调整进度，体验核心前端交互。</p>
      <section class="earloop-player" aria-label="音频播放器演示"><div class="earloop-art">e<span>•</span></div><div class="earloop-controls"><div class="earloop-track"><span><strong id="current-preset">Rain Room</strong> / 04:32</span><span>LOOP 01</span></div><div class="waveform" id="waveform"></div><div class="earloop-player-row"><button class="play-button" id="play-button" aria-label="播放演示">▶</button><input class="earloop-range" type="range" min="0" max="100" value="36" aria-label="播放进度"><span class="earloop-track">01:42</span></div></div></section>
      <div class="earloop-presets"><button class="preset active" data-name="Rain Room"><strong>Rain Room</strong><span>soft / 04:32</span></button><button class="preset" data-name="Night Drive"><strong>Night Drive</strong><span>low / 05:18</span></button><button class="preset" data-name="White Noise"><strong>White Noise</strong><span>clear / 02:48</span></button></div>
    </main>
    <footer class="demo-footer"><span>earloop · standalone HTML demo</span><span><a href="https://github.com/Junmst" target="_blank" rel="noreferrer">下载 / GitHub ↗</a>　<a href="https://gitee.com/junmarvel" target="_blank" rel="noreferrer">Gitee ↗</a></span></footer>
  </div>
  <script src="demo.js" defer></script>
</body>
</html>
